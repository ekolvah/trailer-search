name: Release Please

# One release PR moves every version place; merging it tags `v<version>` and creates
# the GitHub Release. The token is the person's fine-grained PAT, so the required
# contexts run on the release PR; events created with GITHUB_TOKEN start no workflow.
# The release PR merges itself once its required contexts are green and
# `github-actions` approved it.
# Only the nightly or a manually dispatched run opens or updates the release PR; a push
# run still creates the release of a merged release PR, whose merge always moves the manifest.
on:
  push:
    branches: [main]
    paths: [.release-please-manifest.json]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          skip-github-pull-request: ${{ github.event_name == 'push' }}

      # The PR's author is the PAT's person, so the approval of `github-actions` counts for
      # the required approval; the repository allows Actions to approve, or the run fails.
      # Each update of the PR dismisses the approval, and the run that pushed it approves again.
      # Auto-merge waits for the required contexts; a failure to enable it fails the run
      # instead of stalling the PR. `pr` is unset when no PR changed, so the number is
      # parsed in `run`, not in `env`.
      - name: Approve the release PR and enable auto-merge
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAT: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          PR=$(jq -er .number <<< "$PR_JSON")
          gh pr review --approve "$PR"
          GH_TOKEN="$PAT" gh pr merge --auto --squash "$PR"
