minimum_pre_commit_version: "4.4.0"
default_install_hook_types: [pre-push]
repos:
  # agent-process:begin
  - repo: https://github.com/ekolvah/agent-process-distribution
    rev: v3.34.1
    hooks:
      - id: quality
  # agent-process:end
  # The baseline toolchain, this repository's own: edit-time lint runs the `pre-commit` stage
  # on the edited file; the declared `test` runs the `manual` stage at push and in CI.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: ["--extend-select=C901,PLR0911,PLR0912,PLR0913,PLR0915"]
        stages: [pre-commit, manual]
      # The installer-managed check ships in the distribution's own format; init rewrites it.
      - id: ruff-format
        exclude: ^\.claude/agent-process-check\.py$
        stages: [pre-commit, manual]
  # No arguments: an import mypy cannot resolve fails until its types are listed here.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        args: []
        additional_dependencies: [pytest]
        stages: [pre-commit, manual]
  - repo: https://github.com/pylint-dev/pylint
    rev: v4.0.9
    hooks:
      - id: pylint
        args: [--disable=all, --enable=too-many-lines, --max-module-lines=1000]
        stages: [pre-commit, manual]
  # `-X utf8`: without it the scanner silently skips a file the locale encoding cannot decode.
  - repo: local
    hooks:
      - id: detect-secrets
        name: detect-secrets
        entry: python -X utf8 -m detect_secrets.pre_commit_hook
        # release-please's bootstrap-sha is a commit id, not a secret; JSON has no pragma comment.
        args: [--exclude-lines, '"bootstrap-sha": "[0-9a-f]{40}"']
        language: python
        additional_dependencies: [detect-secrets==1.5.0]
        stages: [pre-commit, manual]
  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.0
    hooks:
      - id: pip-audit
        name: pip-audit requirements.txt
        args: [-r, requirements.txt]
        files: ^requirements\.txt$
        stages: [manual]
      - id: pip-audit
        name: pip-audit requirements-dev.txt
        args: [-r, requirements-dev.txt]
        files: ^requirements-dev\.txt$
        stages: [manual]
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest
        language: unsupported
        pass_filenames: false
        files: (^|/)(test_[^/]*|[^/]*_test)\.py$
        stages: [manual]
